<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Audio Process banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#10192e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="50%" stop-color="#1abc9c"/>
      <stop offset="100%" stop-color="#9b59b6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3498db" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1abc9c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9b59b6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>

  <!-- waveform motif -->
  <g transform="translate(760,140)" opacity="0.85">
    <g fill="url(#wave)">
      <rect x="0"   y="-14" width="9" height="28" rx="4.5"/>
      <rect x="18"  y="-34" width="9" height="68" rx="4.5"/>
      <rect x="36"  y="-58" width="9" height="116" rx="4.5"/>
      <rect x="54"  y="-40" width="9" height="80" rx="4.5"/>
      <rect x="72"  y="-72" width="9" height="144" rx="4.5"/>
      <rect x="90"  y="-52" width="9" height="104" rx="4.5"/>
      <rect x="108" y="-84" width="9" height="168" rx="4.5"/>
      <rect x="126" y="-46" width="9" height="92" rx="4.5"/>
      <rect x="144" y="-66" width="9" height="132" rx="4.5"/>
      <rect x="162" y="-30" width="9" height="60" rx="4.5"/>
      <rect x="180" y="-54" width="9" height="108" rx="4.5"/>
      <rect x="198" y="-20" width="9" height="40" rx="4.5"/>
      <rect x="216" y="-38" width="9" height="76" rx="4.5"/>
      <rect x="234" y="-12" width="9" height="24" rx="4.5"/>
    </g>
    <!-- caption chips to the right of the wave -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
      <rect x="268" y="-78" width="150" height="34" rx="17" fill="#3498db" opacity="0.18" stroke="#3498db" stroke-opacity="0.6"/>
      <text x="286" y="-56" fill="#7ec3ef">Speaker 1</text>
      <rect x="290" y="-28" width="150" height="34" rx="17" fill="#2ecc71" opacity="0.18" stroke="#2ecc71" stroke-opacity="0.6"/>
      <text x="308" y="-6" fill="#8ee6b0">Speaker 2</text>
      <rect x="268" y="22" width="150" height="34" rx="17" fill="#9b59b6" opacity="0.18" stroke="#9b59b6" stroke-opacity="0.6"/>
      <text x="286" y="44" fill="#c9a2e0">Çeviri / TR</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="72" y="128" font-size="58" font-weight="700" fill="#f2f6fb" letter-spacing="0.5">Audio Process</text>
    <rect x="74" y="148" width="360" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="192" font-size="21" fill="#aebfd6">Real-time system-audio transcription, speaker diarization</text>
    <text x="72" y="222" font-size="21" fill="#aebfd6">and live translation — on your own machine.</text>
  </g>
</svg>
